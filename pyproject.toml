[project]
name = "drama-agent"
version = "0.1.0"
description = "Short drama production platform powered by multi-agent AI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "openai>=1.50",
    "volcengine-python-sdk[ark]>=5.0",
    "dashscope>=1.20",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "ffmpeg-python>=0.2",
    "pillow>=10.0",
    "python-jose[cryptography]>=3.3",
    "websockets>=12.0",
    "aiofiles>=23.0",
    "tenacity>=8.0",
    "structlog>=24.0",
    "greenlet>=3.5.0",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
